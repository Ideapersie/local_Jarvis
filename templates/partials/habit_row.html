<div id="habit-{{ h.id }}" class="habit-row group">

  <button type="button"
          hx-post="/habits/{{ h.id }}/toggle"
          hx-target="#habit-{{ h.id }}"
          hx-swap="outerHTML"
          aria-pressed="{{ 'true' if h.done_today else 'false' }}"
          aria-label="Toggle {{ h.name }}"
          class="ring-btn">
    <svg width="22" height="22" viewBox="0 0 22 22" class="block">
      <circle cx="11" cy="11" r="8.5" fill="none" stroke="#2a2a2e" stroke-width="2.5"/>
      {% if h.done_today %}
        <circle cx="11" cy="11" r="8.5" fill="none" stroke="#f5a524" stroke-width="2.5"
                stroke-linecap="round" stroke-dasharray="53.4" stroke-dashoffset="0"
                transform="rotate(-90 11 11)"/>
      {% endif %}
    </svg>
  </button>

  <span class="habit-name {{ '' if h.done_today else 'habit-name-off' }}">{{ h.name }}</span>

  <div class="habit-week" title="last 7 days" aria-label="last 7 days">
    {% for d in h.week %}
      {% if d.editable %}
        <button type="button"
                hx-post="/habits/{{ h.id }}/toggle?day={{ d.day }}"
                hx-target="#habit-{{ h.id }}"
                hx-swap="outerHTML"
                aria-pressed="{{ 'true' if d.done else 'false' }}"
                aria-label="Toggle {{ h.name }} on {{ d.day }}"
                title="{{ d.day }}"
                class="wk wk-btn {{ 'wk-on' if d.done else 'wk-off' }}"></button>
      {% else %}
        <span class="wk {{ 'wk-on' if d.done else 'wk-off' }}" title="{{ d.day }}"></span>
      {% endif %}
    {% endfor %}
  </div>

  <span class="habit-streak {{ 'text-amber' if h.current else 'text-neutral-600' }}">{{ h.current }}</span>
  <span class="habit-best">/{{ h.best }}</span>

  <button type="button"
          hx-post="/habits/{{ h.id }}/archive"
          hx-target="#habit-panel"
          hx-swap="innerHTML"
          hx-confirm="Archive {{ h.name }}? Its history is kept."
          aria-label="Archive {{ h.name }}"
          class="row-x">&times;</button>
</div>
