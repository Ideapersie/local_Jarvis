<div class="rows">
  {% for t in tasks %}
    <div class="task-row group">
      <button type="button"
              hx-post="/tasks/{{ t.id }}/toggle"
              hx-target="#task-panel"
              hx-swap="innerHTML"
              aria-pressed="{{ 'true' if t.done else 'false' }}"
              aria-label="Toggle {{ t.title }}"
              class="task-dot {{ 'task-dot-on' if t.done else '' }}"></button>

      <span class="task-title {{ 'task-title-done' if t.done else '' }}">{{ t.title }}</span>

      {% if t.due %}
        <span class="task-due">{{ t.due.isoformat() }}</span>
      {% endif %}

      <button type="button"
              hx-delete="/tasks/{{ t.id }}"
              hx-target="#task-panel"
              hx-swap="innerHTML"
              aria-label="Delete {{ t.title }}"
              class="row-x">&times;</button>
    </div>
  {% else %}
    <p class="empty">Nothing on the list.</p>
  {% endfor %}
</div>

<form hx-post="/tasks"
      hx-target="#task-panel"
      hx-swap="innerHTML"
      hx-on::after-request="this.reset()"
      class="add-form">
  <input name="title" placeholder="new task" required class="fld flex-1 min-w-0">
  <input name="due" type="date" class="fld fld-sm font-mono">
  <button type="submit" class="btn-add">Add</button>
</form>
