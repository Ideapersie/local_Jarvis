<form class="chat-bar"
      aria-label="Ask Jarvis"
      hx-post="/chat/send"
      hx-target="#chat-log"
      hx-swap="beforeend"
      hx-on::after-request="this.reset(); document.body.classList.add('chat-open'); requestAnimationFrame(() => { const l = document.getElementById('chat-log'); l.scrollTop = l.scrollHeight; });">
  <span class="chat-caret" aria-hidden="true">&rsaquo;</span>
  <input type="text" name="message" required autocomplete="off"
         placeholder="Ask Jarvis about your habits, tasks, or what to work on"
         class="chat-input">
  <button type="submit" class="chat-send">Send</button>
</form>
