{% for h in habits %}
  {% with h=h %}{% include "partials/habit_row.html" %}{% endwith %}
{% else %}
  <p class="py-6 text-sm text-neutral-600">No active habits.</p>
{% endfor %}

<form hx-post="/habits"
      hx-target="#habit-panel"
      hx-swap="innerHTML"
      hx-on::after-request="this.reset()"
      class="mt-4 pt-4 border-t border-white/5 flex gap-2">
  <input name="name" placeholder="new habit" required
         class="flex-1 min-w-0 bg-char-700 border border-white/5 rounded px-3 py-1.5 text-sm placeholder:text-neutral-600 focus:outline-none focus:border-amber/40">
  <select name="category"
          class="bg-char-700 border border-white/5 rounded px-2 py-1.5 text-xs text-neutral-400 focus:outline-none focus:border-amber/40">
    <option value="health">health</option>
    <option value="career">career</option>
    <option value="personal">personal</option>
  </select>
  <input name="reminder_time" placeholder="18:00" size="5"
         class="w-16 bg-char-700 border border-white/5 rounded px-2 py-1.5 font-mono text-xs placeholder:text-neutral-600 focus:outline-none focus:border-amber/40">
  <button type="submit"
          class="px-3 py-1.5 rounded bg-amber/15 text-amber text-sm hover:bg-amber/25">Add</button>
</form>
