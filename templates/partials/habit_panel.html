<div class="rows">
  {% for h in habits %}
    {% include "partials/habit_row.html" %}
  {% else %}
    <p class="empty">No active habits.</p>
  {% endfor %}
</div>

<form hx-post="/habits"
      hx-target="#habit-panel"
      hx-swap="innerHTML"
      hx-on::after-request="this.reset()"
      class="add-form">
  <input name="name" placeholder="new habit" required class="fld flex-1 min-w-0">
  <select name="category" class="fld fld-sm">
    <option value="health">health</option>
    <option value="career">career</option>
    <option value="personal">personal</option>
  </select>
  <input name="reminder_time" placeholder="18:00" size="5" class="fld fld-sm font-mono w-14">
  <button type="submit" class="btn-add">Add</button>
</form>
