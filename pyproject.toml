[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
    # Depends()/Form() in argument defaults is the FastAPI idiom, not a bug.
    "B008",
    # SQLModel filters need `== True` / `!= None`: these build SQL expressions,
    # they are not Python truthiness or identity tests. `is not None` would
    # evaluate in Python and produce a bare bool instead of a WHERE clause.
    "E711",
    "E712",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
